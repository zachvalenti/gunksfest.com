<!DOCTYPE html>
<!--
  The clinics page lived here until it was renamed. This stub exists so the
  old URL keeps working: it was public and linked before the rename, and
  GitHub Pages has no server-side redirect to do the job properly.

  A meta refresh is the static-hosting substitute for a 301. It is weaker —
  the browser makes two requests and the back button needs handling — but it
  is what Pages allows. rel=canonical tells search engines which URL is the
  real one, and noindex keeps this stub itself out of results. The visible
  link is the fallback for anyone whose browser ignores the refresh.

  Safe to delete once nothing points at /schedule.html any more.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=clinics.html" />
  <link rel="canonical" href="https://gunksfest.com/clinics.html" />
  <meta name="robots" content="noindex" />
  <title>Clinics — GunksFest V (2026)</title>
</head>
<body>
  <p>This page has moved to <a href="clinics.html">the clinics page</a>.</p>
</body>
</html>
