  <title>Movement Members Tickets — GunksFest 2026</title>

       send a 301, so the page redirects itself (location.replace first, meta

       is the pretix voucher-redemption page for Movement members. The page is
       noindex so the voucher link does not get surfaced by search engines. -->

  <meta http-equiv="refresh" content="0; url=https://pretix.eu/gunksclimbers/gunksfest2026/redeem?voucher=MOVEMENT-MEMBERS-ONLY-2026" />
  <script>location.replace("https://pretix.eu/gunksclimbers/gunksfest2026/redeem?voucher=MOVEMENT-MEMBERS-ONLY-2026");</script>
</head>
