# Clicks every outbound link on the site once a day, logged out, and opens a
# GitHub issue when one of the two that matter — the volunteer sign-up form and
# the ticket shop — stops working. The issue is what reaches you: GitHub emails
# you about a new issue on your own repo, and nothing else here does.
#
# It exists because the volunteer link pointed at a dead Apps Script deployment
# for as long as it took somebody to click it by accident and meet "Sorry,
# unable to open the file at this time." That page comes back as HTTP 200, so
# the check reads what the page says rather than whether it loaded — see the
# long comment at the top of scripts/check-links.mjs.
#
# Setup (optional, but do it):
#   Settings → Secrets and variables → Actions → Variables → New variable
#     VOLUNTEER_MARKER = a phrase from the real sign-up form, e.g. a question it
#     asks. With it set, the check passes only when the form's own words come
#     back, which catches error pages Google hasn't invented yet. Without it,
#     the check still catches every error page we know about, and each run
#     prints the form's title and size so there's an obvious thing to paste in.
name: Check the site's links

on:
  schedule:
    # Once a day, on a weekday morning in New York (13:41 UTC ≈ 9:41 ET), so the
    # mail lands when somebody could actually go and fix it. Off the hour to dodge
    # the rush at :00, same as the pretix sync.
    - cron: "41 13 * * *"
  push:
    branches: [main]
    # A link is usually broken by editing one, so check on the way in too — but
    # only when something that carries a link changed, not on every photo swap.
    paths:
      - "**.html"
      - .github/workflows/link-check.yml
      - scripts/check-links.mjs
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # for the findings issue raised below

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Open every outbound link
        env:
          LINK_FINDINGS: ${{ runner.temp }}/link-findings.txt
          VOLUNTEER_MARKER: ${{ vars.VOLUNTEER_MARKER }}
        run: node scripts/check-links.mjs

      # A broken link in a log nobody opens is not a broken link anybody fixes.
      #
      # This is lifted from pretix-sync.yml on purpose — same problem, same
      # answer. The job runs unattended and succeeds either way, and GitHub only
      # emails you when a workflow *fails*, so the news has to come and find you.
      # It goes into one issue, which notifies on the way in.
      #
      # The issue manages itself: opened when a link breaks, edited and commented
      # when the findings change, and closed by the first run that comes back
      # clean. A run whose findings are identical to the last one does nothing,
      # which is what stops a link that's been broken for a week from mailing you
      # every morning about it.
      #
      # Deliberately NOT a failing job: a failed-workflow email says "something
      # failed", and this one can say "the volunteer form is showing an error
      # page to everyone who clicks it". Failing as well would send both.
      - name: Raise or clear the findings issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS: ${{ runner.temp }}/link-findings.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: A link on gunksfest.com is broken
          LABEL: link-check
        run: |
          set -euo pipefail

          # No file at all means the check died before it could say anything —
          # which is not the same as "all clear" and must not close the issue.
          # That case fails the job, and the failed-workflow email is the alert.
          if [ ! -f "$FINDINGS" ]; then
            echo "The link check did not finish; leaving any open issue alone."
            exit 1
          fi

          # The one issue this workflow owns, found by its label rather than by
          # its title, so the title can be reworded without orphaning it.
          number=$(gh issue list --label "$LABEL" --state open --limit 1 \
                     --json number --jq '.[0].number // empty')

          if [ ! -s "$FINDINGS" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body \
                "Every link came back healthy in [this run]($RUN_URL) — the sign-up form and the ticket shop both loaded, and neither is an error page. Closing."
              gh issue close "$number"
            fi
            echo "No findings."
            exit 0
          fi

          # The body is the findings and nothing else — no run number, no
          # timestamp — so that comparing it against the open issue answers
          # "has anything actually changed?" rather than "did the job run again?"
          body=$(printf 'A link on the site did not load the page it is supposed to. Visitors clicking it are meeting this now.\n\n%s\n\nOpened, updated and closed automatically by `.github/workflows/link-check.yml`. It will close itself on the first run that comes back clean.\n' \
                   "$(sed 's/^/- /' "$FINDINGS")")

          if [ -z "$number" ]; then
            # --label fails on a label that doesn't exist yet, and the first run
            # to find a problem is also the first run to need one.
            gh label create "$LABEL" --description "Raised by the daily link check" --color D93F0B 2>/dev/null || true
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
            exit 0
          fi

          current=$(gh issue view "$number" --json body --jq .body | tr -d '\r')
          if [ "$current" = "$body" ]; then
            echo "Findings unchanged — issue #$number left alone."
            exit 0
          fi
          gh issue edit "$number" --body "$body"
          gh issue comment "$number" --body "The findings changed as of [this run]($RUN_URL)."
